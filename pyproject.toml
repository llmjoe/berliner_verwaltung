[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "berliner-verwaltung"
version = "0.1.0"
description = "Transparenzplattform für Berliner Verwaltungsdaten – automatisierter Recherche-Beschleuniger mit menschlicher Redaktion"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Max Staiber Almeida" }]

dependencies = [
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "prefect>=3.0",
    "rich>=13.9",
    "tenacity>=9.0",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.42",
    "openai>=1.60",
    "ollama>=0.4",
]
pdf = [
    "pdfplumber>=0.11",
    "camelot-py[cv]>=0.11",
]
viz = [
    "altair>=5.5",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=4.0",
]
all = ["berliner-verwaltung[llm,pdf,viz,dev]"]

[project.scripts]
bv = "berliner_verwaltung.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/berliner_verwaltung"]
