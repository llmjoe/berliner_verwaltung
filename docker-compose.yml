services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: bv
      POSTGRES_PASSWORD: bv
      POSTGRES_DB: berliner_verwaltung
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bv -d berliner_verwaltung"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
